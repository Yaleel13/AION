name: Security CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --audit-level=high

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio pyyaml
      - run: python -m compileall -q aion api
      - run: python -m pytest tests/ -q
      - run: python scripts/check_openapi_contract.py
      - run: pip-audit -r requirements.txt

  secret-pattern-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject common committed secret formats
        shell: bash
        run: |
          set -euo pipefail
          patterns=(
            'sk-proj-[A-Za-z0-9_-]{20,}'
            'sk-[A-Za-z0-9]{20,}'
            'ghp_[A-Za-z0-9]{20,}'
            'github_pat_[A-Za-z0-9_]{20,}'
            'postgres(ql)?://[^[:space:]]+:[^<][^@[:space:]]*@'
          )
          failed=0
          for pattern in "${patterns[@]}"; do
            if git grep -nE "$pattern" -- . ':(exclude)package-lock.json' ':(exclude)SECURITY.md'; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo 'Potential committed secret detected. Rotate any real credential before remediation.'
            exit 1
          fi
