integrations:
- name: conversation
  configured: true
  read: true
  propose: true
  approve: false
  execute: true
  scope: AION responses only
  note: Reasoning and responses are not external side effects.
- name: github_runtime
  configured: false
  read: false
  propose: true
  approve: true
  execute: false
  scope: No generic deployed GitHub executor
  note: ChatGPT's connected GitHub tool is separate from the deployed AION runtime;
    this registry does not infer access from it.
- name: memory
  configured: true
  read: true
  propose: true
  approve: true
  execute: true
  scope: Explicit remember/forget/replace only
  note: Permanent memory writes require explicit user language; no automatic profiling.
- name: moltbook
  configured: true
  read: true
  propose: true
  approve: false
  execute: false
  scope: Read research; owner-controlled comments only when activated
  note: No DMs. Approval and execution are separate; autonomous writes remain separately
    gated.
- name: notifications
  configured: false
  read: false
  propose: true
  approve: true
  execute: false
  scope: No deployed email, SMS, call, or push connector
  note: AION may recommend a notification action, but the deployed runtime currently
    has no external delivery connector.
- name: paper_market
  configured: true
  read: true
  propose: true
  approve: false
  execute: true
  scope: Virtual BTC/ETH paper simulation only
  note: Public price marks may be live; order execution is never live trading.
- name: terminal
  configured: false
  read: false
  propose: false
  approve: true
  execute: false
  scope: Fixed inspect/lint/build/all Vercel Sandbox actions
  note: Arbitrary shell commands, deployments, destructive commands, and production-secret
    injection remain disabled.
policy:
  capability_model: capability-level-least-privilege
  global_autonomy_switch: false
webhooks: []
ci_checks:
- npm ci
- npm run lint
- npm run build
- npx tsc --noEmit
- python -m compileall -q aion api
- pytest tests/ -q
- python scripts/check_openapi_contract.py
- python scripts/check_inventory_contract.py
- pip-audit
- npm audit --audit-level=high
- secret-pattern-check
